<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>ROCK PAPER SCISSOR SHOOT ...</h1>
    <div class="choices">
        <img src="img/rock.png" alt="Rock image" class="rock">
        <img src="img/paper.png" alt="Paper image" class="paper">
        <img src="img/scissors.png" alt="Scissors image" class="scissor">
    </div>
    <div class="score">
        <h3>Scores</h3>
        <div class="scores">
            <p class="player-score">Player: </p>
            <p class="computer-score">Computer: </p>
        </div>
    </div>
    <script src="app.js"></script>
</body>

</html>
